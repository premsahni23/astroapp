spring.application.name=mindaro-backend

# -------------------------
# Springdoc / Swagger
# -------------------------
springdoc.api-docs.enabled=true
springdoc.packages-to-scan=com.dekhokaun.mindarobackend.controller
logging.level.org.springdoc=INFO

# -------------------------
# MariaDB Database Configuration
# -------------------------
spring.datasource.url=${DATABASE_URL:jdbc:mariadb://localhost:3306/mindaro_db}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:your_password}

# -------------------------
# Hibernate / JPA
# -------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# -------------------------
# JSON
# -------------------------
# Strict snake_case for all API responses/requests (Jackson)
spring.jackson.property-naming-strategy=SNAKE_CASE

# -------------------------
# Server Configuration
# -------------------------
server.port=3000
server.address=0.0.0.0
server.tomcat.threads.max=200
server.connection-timeout=5s
server.max-http-request-header-size=8KB

# IMPORTANT: Prevent HTTPS → HTTP garbage requests
server.tomcat.reject-illegal-header=true

# -------------------------
# Logging (FIXED)
# -------------------------
# Reduce noisy EOFException logs from aborted connections
logging.level.org.apache.coyote.http11=WARN
logging.level.org.apache.tomcat.util.http=WARN
logging.level.org.apache.tomcat.util.net=WARN

# Optional: Keep Spring Web logs readable
logging.level.org.springframework.web=INFO
